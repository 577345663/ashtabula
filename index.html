<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashtabula</title>

<style>
body{
  margin:0;
  font-family:-apple-system,system-ui,sans-serif;
  background:linear-gradient(#e6f0ff,#f8fbff);
  display:flex;
  justify-content:center;
}

.app{max-width:520px;width:100%}

/* TOP BAR */
.top{
  padding:16px;
  display:flex;
  gap:8px;
}

.search{
  flex:1;
  padding:12px;
  border-radius:14px;
  border:none;
}

.btn{
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  border:none;
  background:#1e4f8a;
  color:white;
  font-size:18px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  padding:16px;
}

.tile{
  position:relative;
  height:110px;
  border-radius:16px;
  overflow:hidden;
  background-size:cover;
}

.tile::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top, rgba(0,0,0,.35), rgba(0,0,0,.05));
}

.label{
  position:absolute;
  bottom:10px;
  left:0;
  right:0;
  text-align:center;
  color:#fff;
  font-weight:700;
  z-index:2;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  align-items:flex-end;
}

.panel{
  background:white;
  width:100%;
  max-width:520px;
  border-radius:20px 20px 0 0;
  padding:20px;
}
</style>
</head>

<body>

<div class="app">

<div class="top">
  <input id="search" class="search" placeholder="Search ashtabula.info">
  <button class="btn" onclick="renderHome()">🏠</button>
  <button class="btn" onclick="toggleOptions()">⚙</button>
</div>

<div id="content"></div>

</div>

<div id="options" class="modal">
  <div class="panel">
    Options panel (placeholder)
  </div>
</div>

<script>

/* MAIN */
const cats = [
["Food","food"],
["Fuel","gas"],
["Grocery","grocery"],
["Outdoors","outdoors"],
["Sights","attractions"],
["Lodging","lodging"],
["Auto","auto"],
["Shopping","shopping"],
["Services","services"],
["Banks","banks"],
["Health","health"],
["Pets","pets"],
["Civic","civic"],
["Utilities","utilities"],
["Other","other"]
];

/* SUBS */
const foodSubs = ["Asian","Bars","Desserts","Dining","Donuts","FastFood","Pizza","Seafood","Wineries"];
const autoSubs = ["Sales","Repairs","Wash"];

/* HOME */
function renderHome(){
content.innerHTML = `
<div class="grid">
${cats.map(c=>`
<div class="tile" onclick="openCat('${c[1]}')"
style="background-image:url('images/categories/${c[1]}.png')">
<div class="label">${c[0]}</div>
</div>`).join("")}
</div>`;
}

/* CATEGORY */
function openCat(cat){

if(cat==="food"){
content.innerHTML = `
<div class="grid">
${foodSubs.map(s=>`
<div class="tile"
style="background-image:url('images/food/${s.toLowerCase()}.png')">
<div class="label">${s}</div>
</div>`).join("")}
</div>`;
return;
}

if(cat==="auto"){
content.innerHTML = `
<div class="grid">
${autoSubs.map(s=>`
<div class="tile"
style="background-image:url('images/auto/${s.toLowerCase()}.png')">
<div class="label">${s}</div>
</div>`).join("")}
</div>`;
return;
}

}

/* OPTIONS */
let open=false;
function toggleOptions(){
options.style.display = open?"none":"flex";
open=!open;
}

renderHome();

</script>

</body>
</html>
