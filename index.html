<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashtabula</title>

<style>
body{
  margin:0;
  font-family:-apple-system,system-ui,sans-serif;
  background:linear-gradient(#e6f0ff,#f8fbff);
  display:flex;
  justify-content:center;
}

.app{
  max-width:520px;
  width:100%;
}

/* SEARCH */
.searchRow{
  padding:16px;
  display:flex;
  gap:10px;
}

.search{
  flex:1;
  padding:12px;
  border-radius:14px;
  border:none;
  background:white;
}

.btn{
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  border:none;
  background:#1e4f8a;
  color:white;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  padding:16px;
}

.tile{
  position:relative;
  height:110px;
  border-radius:16px;
  overflow:hidden;
  background-size:cover;
  background-position:center;
}

.tile::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top, rgba(0,0,0,.45), rgba(0,0,0,.1));
}

.label{
  position:absolute;
  bottom:10px;
  left:0;
  right:0;
  text-align:center;
  color:white;
  font-weight:700;
}

/* LIST */
.list{
  padding:16px;
}

.item{
  background:#ffffffcc;
  border-radius:14px;
  padding:12px;
  margin-bottom:10px;
}

.top{
  display:flex;
  justify-content:space-between;
  font-weight:600;
}

.addr,.web{
  font-size:13px;
  margin-top:4px;
}

a{
  color:#1e4f8a;
  text-decoration:none;
}

/* FOOTER */
.footer{
  padding:40px 16px 20px;
  text-align:center;
  font-size:11px;
  color:#666;
}
</style>
</head>

<body>

<div class="app">

<div class="searchRow">
  <input id="search" class="search" placeholder="Search ashtabula.info">
  <button class="btn" onclick="renderHome()">⌂</button>
</div>

<div id="content"></div>

<div class="footer">© 2026 ashtabula.info</div>

</div>

<script>

/* REAL TEST DATA BASE */
const baseAddress = "4335 Park Ave, Ashtabula, OH 44004"; // Public Library
const basePhone = "440-997-9341"; // Public Library
const baseWeb = "https://www.ashtabulalibrary.org";

/* CATEGORIES */
const categories = [
["Food","food"],["Fuel","gas"],["Grocery","grocery"],
["Outdoors","outdoors"],["Attractions","attractions"],
["Lodging","lodging"],["Auto","auto"],["Shopping","shopping"],
["Services","services"],["Banks","banks"],["Health","health"],
["Pets","pets"],["Civic","civic"],["Utilities","utilities"],["Other","other"]
];

/* TEST PLACES */
const places = [
{n:"Harbor Slice Co",c:"food"},
{n:"Dockside Pizza",c:"food"},
{n:"Sunrise Donuts",c:"food"},
{n:"Quick Fuel Station",c:"gas"},
{n:"Lakeside Market",c:"grocery"},
{n:"State Park Trail",c:"outdoors"},
{n:"Harbor Lighthouse",c:"attractions"},
{n:"Lakeview Inn",c:"lodging"},
{n:"City Auto Repair",c:"auto"},
{n:"Main Street Shops",c:"shopping"},
{n:"Fix-It Services",c:"services"},
{n:"Community Bank",c:"banks"},
{n:"Urgent Care Center",c:"health"},
{n:"Happy Paws Vet",c:"pets"},
{n:"City Hall",c:"civic"},
{n:"Water Dept",c:"utilities"},
{n:"Random Listing",c:"other"}
].map(p => ({
...p,
p: basePhone,
a: baseAddress,
w: baseWeb
}));

/* HOME */
function renderHome(){
content.innerHTML = `
<div class="grid">
${categories.map(c=>`
<div class="tile" onclick="openCategory('${c[1]}')"
style="background-image:url('images/categories/${c[1]}.png')">
<div class="label">${c[0]}</div>
</div>`).join("")}
</div>`;
}

/* CATEGORY VIEW */
function openCategory(cat){
let results = places.filter(p=>p.c===cat);

content.innerHTML = `
<div class="list">
<button onclick="renderHome()">Back</button>
${results.map(r=>`
<div class="item">
<div class="top">
<div>${r.n}</div>
<div><a href="tel:${r.p}">${r.p}</a></div>
</div>
<div class="addr">
<a href="https://maps.google.com/?q=${encodeURIComponent(r.a)}">${r.a}</a>
</div>
<div class="web">
<a href="${r.w}" target="_blank">${r.w}</a>
</div>
</div>
`).join("")}
</div>`;
}

/* SEARCH */
search.oninput = ()=>{
let q = search.value.toLowerCase();
let results = places.filter(p=>p.n.toLowerCase().includes(q));

content.innerHTML = `
<div class="list">
${results.map(r=>`
<div class="item">
<div class="top">
<div>${r.n}</div>
<div><a href="tel:${r.p}">${r.p}</a></div>
</div>
<div class="addr">
<a href="https://maps.google.com/?q=${encodeURIComponent(r.a)}">${r.a}</a>
</div>
</div>
`).join("")}
</div>`;
};

renderHome();

</script>

</body>
</html>
