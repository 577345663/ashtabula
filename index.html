<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashtabula Co.</title>

<style>
body{margin:0;font-family:-apple-system,system-ui;background:linear-gradient(#e6f0ff,#f8fbff);display:flex;justify-content:center}
.app{max-width:520px;width:100%}

.top{padding:16px;display:flex;gap:8px}
.search{flex:1;padding:12px;border-radius:14px;border:none}
.btn{width:44px;height:44px;border-radius:12px;border:none;background:#1e4f8a;color:#fff}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px}
.tile{position:relative;height:110px;border-radius:16px;overflow:hidden;background-size:cover}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.35),rgba(0,0,0,.05))}
.label{position:absolute;bottom:10px;width:100%;text-align:center;color:#fff;font-weight:700}

.list{padding:16px}

/* cards */
.item{border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid rgba(0,0,0,.08)}
.alt1{background:rgba(30,79,138,.08)}
.alt2{background:rgba(255,165,0,.1)}
.alt3{background:rgba(60,180,75,.1)}
.announce{background:rgba(255,215,0,.15)}

.toprow{display:flex;justify-content:space-between;font-weight:600}
.addr,.web{font-size:13px;margin-top:4px}

/* modal fix */
.modal{position:fixed;inset:0;background:#000c;display:none;justify-content:center;align-items:flex-end;transform:translateZ(0);isolation:isolate}
.panel{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px;-webkit-text-fill-color:#000}
.panel *{-webkit-text-fill-color:#000}

.zipGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

.splash{position:fixed;inset:0;background:#000;display:none;z-index:999}
.splashInner{height:100%;background:url('images/splash.jpg') center/cover}
.splashContent{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff}
</style>
</head>

<body>

<div class="app">

<div class="top">
<input id="search" class="search" placeholder="Search ashtabula.info">
<button class="btn" onclick="renderHome()">🏠</button>
<button class="btn" onclick="toggleOptions()">⚙</button>
</div>

<div id="content"></div>

</div>

<div id="options" class="modal">
<div class="panel">
<b>Zip Codes</b>
<div id="zipBox" class="zipGrid"></div>
</div>
</div>

<div id="splash" class="splash" onclick="this.style.display='none'">
<div class="splashInner"></div>
<div class="splashContent">
<h2>Ashtabula.info</h2>
<p>Directory & Lookup</p>
</div>
</div>

<script>

/* data */
const places=[
{type:"announcement",c:"food",s:"pizza",active:true,text:"Free slice today!"},

{n:"Pizza Spot",c:"food",s:"pizza",featured:true},
{n:"Slice House",c:"food",s:"pizza",featured:false},

{n:"Burger Joint",c:"food",s:"fastfood"},
{n:"Quick Bites",c:"food",s:"fastfood"},

{n:"Repair Garage",c:"auto",s:"repairs"},
{n:"Car Dealer",c:"auto",s:"sales"}
].map(x=>({...x,p:"440-000-0000",a:"123 Main",w:"https://google.com"}))

/* structure */
const cats=[
["Food","food"],["Fuel","gas"],["Grocery","grocery"],
["Outdoors","outdoors"],["Sights","attractions"],
["Lodging","lodging"],["Auto","auto"],["Shopping","shopping"],
["Services","services"],["Banks","banks"],["Health","health"],
["Pets","pets"],["Civic","civic"],["Utilities","utilities"],["Other","other"]
]

const foodSubs=["pizza","fastfood","dining","bars","coffee","bakery","asian","seafood","wineries"]
const autoSubs=["sales","repairs","wash"]

/* home */
function renderHome(){
content.innerHTML=`<div class="grid">${
cats.map(c=>`
<div class="tile" onclick="openCat('${c[1]}')" style="background-image:url('images/categories/${c[1]}.jpg')">
<div class="label">${c[0]}</div></div>`).join("")}</div>`
}

/* category */
function openCat(cat){
if(cat==="food"){
content.innerHTML=subGrid("food",foodSubs)
return
}
if(cat==="auto"){
content.innerHTML=subGrid("auto",autoSubs)
return
}
openList(cat)
}

/* sub grid */
function subGrid(cat,subs){
return `<div class="grid">${
subs.map(s=>`
<div class="tile" onclick="openList('${cat}','${s}')" style="background-image:url('images/${cat}/${s}.jpg')">
<div class="label">${cap(s)}</div></div>`).join("")}</div>`
}

/* list */
function openList(cat,sub){
let data=places.filter(p=>p.c===cat && (!sub||p.s===sub))

let announce=data.find(p=>p.type==="announcement"&&p.active)
let featured=data.filter(p=>p.featured).sort((a,b)=>a.n.localeCompare(b.n))
let normal=data.filter(p=>!p.featured)

let final=[...(announce?[announce]:[]),...featured,...normal]

content.innerHTML=`<div class="list">
${sub?`<button onclick="openCat('${cat}')">Back</button>`:""}
${final.map((d,i)=>{
if(d.type==="announcement"){
return `<div class="item announce">📣 ${d.text}</div>`
}
return `<div class="item alt${(i%3)+1}">
<div class="toprow"><div>${d.n}${d.featured?" ⭐":""}</div><div>${d.p}</div></div>
<div class="addr">${d.a}</div>
<div class="web">${d.w}</div>
</div>`
}).join("")}
</div>`
}

/* helpers */
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}

renderHome()
splash.style.display="block"

</script>

</body>
</html>
