<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashtabula</title>

<style>
body{
  margin:0;
  font-family:-apple-system,system-ui,sans-serif;
  background:linear-gradient(#e6f0ff,#f8fbff);
  display:flex;
  justify-content:center;
}

.app{max-width:520px;width:100%}

/* TOP */
.top{
  padding:16px;
  display:flex;
  gap:8px;
}

.search{
  flex:1;
  padding:12px;
  border-radius:14px;
  border:none;
}

.btn{
  width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;
  border-radius:12px;border:none;
  background:#1e4f8a;color:white;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  padding:16px;
}

.tile{
  position:relative;
  height:110px;
  border-radius:16px;
  overflow:hidden;
  background-size:cover;
}

.tile::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top, rgba(0,0,0,.35), rgba(0,0,0,.05));
}

.label{
  position:absolute;
  bottom:10px;
  left:0;right:0;
  text-align:center;
  color:#fff;
  font-weight:700;
  z-index:2;
}

/* LIST */
.list{padding:16px}

.item{
  background:#ffffffee;
  border-radius:14px;
  padding:12px;
  margin-bottom:10px;
}

.toprow{
  display:flex;
  justify-content:space-between;
  font-weight:600;
}

.addr,.web{
  font-size:13px;
  margin-top:4px;
  word-break:break-all;
}

/* OPTIONS */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  justify-content:center;
  align-items:flex-end;
}

.panel{
  background:#fff;
  width:100%;
  max-width:520px;
  border-radius:20px 20px 0 0;
  padding:20px;
  color:#000;
}

/* FOOTER */
.footer{
  padding:40px 16px 20px;
  text-align:center;
  font-size:11px;
  color:#666;
}
</style>
</head>

<body>

<div class="app">

<div class="top">
  <input id="search" class="search" placeholder="Search ashtabula.info">
  <button class="btn" onclick="renderHome()">🏠</button>
  <button class="btn" onclick="toggleOptions()">⚙</button>
</div>

<div id="content"></div>

<div class="footer">© 2026 ashtabula.info</div>

</div>

<!-- OPTIONS -->
<div id="options" class="modal" onclick="toggleOptions()">
  <div class="panel" onclick="event.stopPropagation()">
    <b>Options</b><br><br>

    <div><b>Zip Filters (placeholder)</b></div>
    <label><input type="checkbox" checked> 44004</label><br>
    <label><input type="checkbox" checked> 44005</label><br>
    <label><input type="checkbox" checked> 44030</label><br>
    <label><input type="checkbox" checked> 44041</label><br>

    <br>
    <label><input type="checkbox"> Include surrounding counties</label>

    <br><br>
    <button onclick="toggleOptions()">Close</button>
  </div>
</div>

<script>

/* MAP */
function mapLink(addr){
  return /iPhone|iPad|iPod/i.test(navigator.userAgent)
    ? `http://maps.apple.com/?q=${encodeURIComponent(addr)}`
    : `https://maps.google.com/?q=${encodeURIComponent(addr)}`;
}

/* DATA */
const basePhone="440-997-9341";

function makePlace(name,cat,sub,zip,county){
  return {
    n:name,
    c:cat,
    s:sub,
    p:basePhone,
    a:`123 Main St, OH ${zip}`,
    w:`https://google.com`,
    z:zip,
    co:county
  };
}

/* FULL TEST DATA */
const places = [

/* FOOD */
makePlace("Pizza Spot","food","pizza","44004","Ashtabula"),
makePlace("Burger Joint","food","fastfood","44005","Ashtabula"),
makePlace("Seafood Shack","food","seafood","44041","Ashtabula"),
makePlace("Donut Shop","food","donuts","44004","Ashtabula"),
makePlace("Wine House","food","wineries","44030","Ashtabula"),
makePlace("Asian Kitchen","food","asian","44004","Ashtabula"),

/* AUTO */
makePlace("Repair Garage","auto","repairs","44004","Ashtabula"),
makePlace("Car Dealer","auto","sales","44041","Ashtabula"),
makePlace("Car Wash","auto","wash","44005","Ashtabula"),

/* ALL OTHER CATS */
makePlace("Fuel One","gas",null,"44004","Ashtabula"),
makePlace("Fuel Two","gas",null,"44057","Lake"),

makePlace("Market One","grocery",null,"44004","Ashtabula"),
makePlace("Market Two","grocery",null,"44077","Lake"),

makePlace("Clinic One","health",null,"44004","Ashtabula"),
makePlace("Clinic Two","health",null,"44005","Ashtabula"),

makePlace("Bank One","banks",null,"44004","Ashtabula"),
makePlace("Bank Two","banks",null,"44005","Ashtabula"),

makePlace("City Hall","civic",null,"44004","Ashtabula"),
makePlace("Water Dept","utilities",null,"44004","Ashtabula"),

makePlace("Park Trail","outdoors",null,"44004","Ashtabula"),
makePlace("Lighthouse","attractions",null,"44004","Ashtabula"),

makePlace("Hotel One","lodging",null,"44004","Ashtabula"),

makePlace("Pet Clinic","pets",null,"44004","Ashtabula"),

makePlace("Fix Services","services",null,"44004","Ashtabula"),

makePlace("Shop Center","shopping",null,"44004","Ashtabula"),

makePlace("Other Listing","other",null,"44004","Ashtabula")

];

/* STRUCTURE */
const cats=[
["Food","food"],["Fuel","gas"],["Grocery","grocery"],
["Outdoors","outdoors"],["Sights","attractions"],
["Lodging","lodging"],["Auto","auto"],["Shopping","shopping"],
["Services","services"],["Banks","banks"],["Health","health"],
["Pets","pets"],["Civic","civic"],["Utilities","utilities"],["Other","other"]
];

const foodSubs=["asian","bars","desserts","dining","donuts","fastfood","pizza","seafood","wineries"];
const autoSubs=["sales","repairs","wash"];

/* HOME */
function renderHome(){
content.innerHTML=`<div class="grid">${
cats.map(c=>`
<div class="tile" onclick="openCat('${c[1]}')"
style="background-image:url('images/categories/${c[1]}.png')">
<div class="label">${c[0]}</div>
</div>`).join("")}</div>`;
}

/* CATEGORY */
function openCat(cat){

if(cat==="food"){
content.innerHTML=`<div class="grid">${
foodSubs.map(s=>`
<div class="tile" onclick="openList('food','${s}')"
style="background-image:url('images/food/${s}.png')">
<div class="label">${s}</div>
</div>`).join("")}</div>`;
return;
}

if(cat==="auto"){
content.innerHTML=`<div class="grid">${
autoSubs.map(s=>`
<div class="tile" onclick="openList('auto','${s}')"
style="background-image:url('images/autos/${s}.png')">
<div class="label">${s}</div>
</div>`).join("")}</div>`;
return;
}

openList(cat);
}

/* LIST */
function openList(cat,sub){
let data=places.filter(p=>sub?(p.c===cat&&p.s===sub):p.c===cat);

content.innerHTML=`<div class="list">
<button onclick="renderHome()">Back</button>
${data.map(d=>`
<div class="item">
<div class="toprow">
<div>${d.n}</div>
<div><a href="tel:${d.p}">${d.p}</a></div>
</div>
<div class="addr">
<a href="${mapLink(d.a)}">${d.a}</a>
</div>
<div class="web">
<a href="${d.w}" target="_blank">${d.w}</a>
</div>
</div>`).join("")}
</div>`;
}

/* SEARCH */
search.oninput=()=>{
let q=search.value.toLowerCase();
let data=places.filter(p=>p.n.toLowerCase().includes(q));
openList("",null,data);
};

/* OPTIONS */
let open=false;
function toggleOptions(){
options.style.display=open?"none":"flex";
open=!open;
}

renderHome();

</script>

</body>
</html>
